[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transcribe-translate"
version = "0.2.7"
description = "Local video transcription and speech translation with optional API text translation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "faster-whisper==1.2.1",
  "ctranslate2==4.7.2",
  "av==18.1.0",
  "httpx==0.28.1",
  "huggingface-hub==1.33.0",
]

[project.scripts]
transcribe-translate = "transcribe_translate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
transcribe_translate = ["large_v3_manifest.json"]
